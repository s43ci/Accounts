<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مركز حساباتي</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    
    <link rel="preload" as="image" href="insta-main.png">
    <link rel="preload" as="image" href="insta-research.png">
    <link rel="preload" as="image" href="tiktok.png">
    <link rel="preload" as="image" href="telegram.png">
    <link rel="preload" as="image" href="tellonym.png">

    <style>
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #2b2b2b;
            --shadow-color: rgba(0, 0, 0, 0.08);
            --hover-shadow: rgba(0, 0, 0, 0.15);
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 40px;
            text-align: center;
            color: var(--text-color);
            letter-spacing: 1px;
        }

        .grid-container {
            display: grid;
            /* عرض الكروت يتجاوب تلقائياً مع الشاشة */
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 30px;
            max-width: 1000px;
            width: 100%;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            text-decoration: none;
            color: inherit;
            box-shadow: 0 10px 20px var(--shadow-color);
            /* الإفّكت المرتب عند الحركة */
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card:hover {
            transform: translateY(-10px) scale(1.03);
            box-shadow: 0 15px 30px var(--hover-shadow);
        }

        .card:active {
            transform: translateY(-2px) scale(0.98);
        }

        .app-name {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 15px;
            color: #4a4a4a;
        }

        .card img {
            width: 100%;
            border-radius: 12px;
            object-fit: cover;
            /* ظل خفيف للصورة نفسها يعطيها عمق */
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: opacity 0.3s ease;
        }
    </style>
</head>
<body>

    <h1 class="header-title">مركز حساباتي</h1>

    <div class="grid-container">
        
        <a href="https://instagram.com/w_j56" target="_blank" class="card">
            <div class="app-name">انستقرام | حسابي الشخصي</div>
            <img src="insta-main.png" alt="انستقرام الأساسي" loading="eager">
        </a>

        <a href="https://instagram.com/707l14" target="_blank" class="card">
            <div class="app-name">انستقرام | البحوث</div>
            <img src="insta-research.png" alt="انستقرام البحوث" loading="eager">
        </a>

        <a href="https://tiktok.com/@s43ci" target="_blank" class="card">
            <div class="app-name">تيك توك</div>
            <img src="tiktok.png" alt="تيك توك" loading="eager">
        </a>

        <a href="https://t.me/s60254" target="_blank" class="card">
            <div class="app-name">قناة التيليجرام</div>
            <img src="telegram.png" alt="تيليجرام" loading="eager">
        </a>

        <a href="https://tellonym.me/s43ci" target="_blank" class="card">
            <div class="app-name">تيلونيم</div>
            <img src="tellonym.png" alt="تيلونيم" loading="eager">
        </a>

    </div>

</body>
</html>
